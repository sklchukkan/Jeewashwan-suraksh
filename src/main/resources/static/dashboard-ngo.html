<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGO Dashboard | Jeevashwan Surakhsh</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        .ngo-workspace {
            display: grid;
            grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.2fr);
            gap: 20px;
            margin-top: 20px;
        }

        .work-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: #fff;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .work-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.08);
        }

        .work-card.active {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .status-pill {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            margin-top: 6px;
        }

        .status-pill.sent, .status-pill.accepted { background: #ffedd5; color: #9a3412; }
        .status-pill.completed { background: #dcfce7; color: #166534; }

        .detail-panel {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            background: #fff;
            min-height: 420px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 16px 0;
        }

        .detail-item label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .detail-item p {
            margin: 0;
            color: #334155;
            font-weight: 500;
        }

        .desc-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            color: #334155;
            margin-top: 6px;
        }

        .report-image-box {
            margin-top: 16px;
        }

        .report-image-box label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .report-image-box img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            object-fit: contain;
            background: #f8fafc;
        }

        .receipt-upload {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .receipt-upload input[type="file"] {
            flex: 1;
            min-width: 220px;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
        }

        .placeholder-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 360px;
            color: #94a3b8;
            text-align: center;
        }

        @media (max-width: 900px) {
            .ngo-workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body style="background-color: var(--color-bg);">
    <nav class="scrolled">
        <div class="nav-container">
            <div class="logo">
                <span class="material-icons-outlined logo-icon">pets</span>
                <span>Jeevashwan Surakhsh</span>
            </div>
            <div class="nav-actions">
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container" style="padding-top:120px;">
        <h2>NGO Dashboard</h2>

        <div class="ngo-workspace">
            <div>
                <div class="feature-card">
                    <h3>Assigned Work Quotations</h3>
                    <div id="quotationsList" style="margin-top:15px;"></div>
                </div>

                <div class="feature-card" style="margin-top:20px;">
                    <h3>Complaints Handled by Your NGO</h3>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; margin-top:15px;">
                        <div style="border:1px solid #e2e8f0; border-radius:10px; padding:14px; background:#ffffff;">
                            <h4 style="margin:0 0 10px 0; color:#16a34a; display:flex; justify-content:space-between; align-items:center;">
                                <span>Solved Complaints</span>
                                <span id="solvedCountBadge" style="background:#dcfce7; color:#166534; border-radius:999px; padding:2px 10px; font-size:0.8rem; font-weight:600;">0</span>
                            </h4>
                            <div id="solvedComplaintsList"></div>
                        </div>
                        <div style="border:1px solid #e2e8f0; border-radius:10px; padding:14px; background:#ffffff;">
                            <h4 style="margin:0 0 10px 0; color:#dc2626; display:flex; justify-content:space-between; align-items:center;">
                                <span>Unsolved Complaints</span>
                                <span id="unsolvedCountBadge" style="background:#fee2e2; color:#991b1b; border-radius:999px; padding:2px 10px; font-size:0.8rem; font-weight:600;">0</span>
                            </h4>
                            <div id="unsolvedComplaintsList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-panel" id="workDetailPanel">
                <div class="placeholder-view">
                    <span class="material-icons-outlined" style="font-size:3.5rem; margin-bottom:12px;">touch_app</span>
                    <p>Click an assigned or completed work item to view full reporter details.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let quotations = [];
        let selectedQuotationId = null;

        async function loadNGOData() {
            const h = { 'Authorization': 'Bearer ' + token };
            const res = await fetch('/api/ngo/quotations', { headers: h });
            quotations = res.ok ? await res.json() : [];
            renderWorkLists();

            // Auto-select first item on load if not selected
            if (quotations.length > 0 && !selectedQuotationId) {
                selectWork(quotations[0].quotation_id);
            }
        }

        function renderWorkLists() {
            const ql = document.getElementById('quotationsList');
            const solvedEl = document.getElementById('solvedComplaintsList');
            const unsolvedEl = document.getElementById('unsolvedComplaintsList');
            const solvedCountBadge = document.getElementById('solvedCountBadge');
            const unsolvedCountBadge = document.getElementById('unsolvedCountBadge');
            const solved = [];
            const unsolved = [];

            ql.innerHTML = '';
            if (!quotations.length) {
                ql.innerHTML = '<p style="color:#64748b;">No assigned work yet.</p>';
            }

            quotations.forEach(q => {
                const isActive = selectedQuotationId === q.quotation_id;
                const statusClass = String(q.status || '').toLowerCase();
                ql.innerHTML += `
                    <div class="work-card ${isActive ? 'active' : ''}" onclick="selectWork(${q.quotation_id})">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <strong>Work ID: ${q.quotation_id}</strong>
                            <span class="status-pill ${statusClass}" style="margin-top:0;">${q.status}</span>
                        </div>
                        <div style="margin-top:6px; color:#475569; font-weight:500;">Complaint #${q.complaint_id || 'N/A'} · ${q.area_name || 'Unknown area'}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; color:#64748b; margin-top:4px;">
                            <span>Dogs: ${q.dog_count || 1} (${q.behavior || 'Calm'})</span>
                            <strong>₹${q.amount}</strong>
                        </div>
                    </div>
                `;

                if (statusClass === 'completed') {
                    solved.push(q);
                } else {
                    unsolved.push(q);
                }
            });

            renderComplaintStatusList(solvedEl, solved, true);
            renderComplaintStatusList(unsolvedEl, unsolved, false);
            solvedCountBadge.innerText = solved.length;
            unsolvedCountBadge.innerText = unsolved.length;
        }

        function renderComplaintStatusList(container, items, solved) {
            if (!items.length) {
                container.innerHTML = `<p style="margin:0; color:#64748b;">No ${solved ? 'solved' : 'unsolved'} complaints yet.</p>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const isActive = selectedQuotationId === item.quotation_id;
                return `
                    <div class="work-card ${isActive ? 'active' : ''}" onclick="selectWork(${item.quotation_id})">
                        <strong>Complaint #${item.complaint_id || item.quotation_id}</strong><br>
                        <div style="color:#334155; font-weight:500; margin-top:2px;">${item.area_name || 'Unknown area'}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:#64748b; margin-top:4px;">
                            <span>Dogs: ${item.dog_count || 1} (${item.behavior || 'Calm'})</span>
                            <span>Status: ${item.status}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectWork(quotationId) {
            selectedQuotationId = quotationId;
            const work = quotations.find(q => q.quotation_id === quotationId);
            if (!work) return;

            renderWorkLists();

            const reportedAt = work.reported_at ? new Date(work.reported_at).toLocaleString() : 'Unknown';
            const assignedAt = work.created_at ? new Date(work.created_at).toLocaleString() : 'Unknown';
            const statusClass = String(work.status || '').toLowerCase();

            let actionHtml = '';
            if (work.status === 'Sent' || work.status === 'Accepted') {
                actionHtml = `
                    <div style="margin-top:20px; padding-top:16px; border-top:1px solid #e2e8f0;">
                        <h4 style="margin-bottom:10px;">Complete This Work</h4>
                        <p style="color:#64748b; font-size:0.9rem; margin-bottom:12px;">Upload a receipt or acknowledgement photo to mark this work as completed.</p>
                        <div class="receipt-upload">
                            <input type="file" id="receiptFile-${work.quotation_id}" accept="image/png, image/jpeg">
                            <button class="btn btn-primary" onclick="uploadReceipt(${work.quotation_id})">Mark Completed & Upload Receipt</button>
                        </div>
                    </div>
                `;
            } else if (work.has_receipt_image && work.receipt_id) {
                actionHtml = `
                    <div style="margin-top:20px; padding-top:16px; border-top:1px solid #e2e8f0;">
                        <h4 style="margin-bottom:10px;">Submitted Receipt</h4>
                        <div class="report-image-box">
                            <label>Receipt Photo (Click to enlarge)</label>
                            <img src="/api/receipts/${work.receipt_id}/image?token=${encodeURIComponent(token)}" alt="Receipt photo" style="cursor:zoom-in; transition: transform 0.2s; max-width: 100%; border-radius: 8px; border: 1px solid #e2e8f0;" onclick="openImagePreview(this.src)" title="Click to view full size">
                        </div>
                    </div>
                `;
            }

            const reportImageHtml = work.has_report_image
                ? `<div class="report-image-box">
                        <label>Sighting Photo (Click to enlarge)</label>
                        <img src="/api/reports/${work.complaint_id}/image?token=${encodeURIComponent(token)}" alt="Report photo" style="cursor:zoom-in; transition: transform 0.2s; max-width: 100%; border-radius: 8px; border: 1px solid #e2e8f0;" onclick="openImagePreview(this.src)" title="Click to view full size">
                   </div>`
                : '';

            document.getElementById('workDetailPanel').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px;">
                    <div>
                        <h3 style="margin:0 0 6px 0;">Reporter Details</h3>
                        <p style="margin:0; color:#64748b;">Work ID #${work.quotation_id} · Complaint #${work.complaint_id || 'N/A'}</p>
                    </div>
                    <span class="status-pill ${statusClass}">${work.status}</span>
                </div>

                <div class="detail-grid">
                    <div class="detail-item">
                        <label>Reporter Name</label>
                        <p>${work.reporter_name || 'Anonymous'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Contact Phone</label>
                        <p><a href="tel:${work.reporter_phone}" style="color:#3b82f6; text-decoration:underline;">${work.reporter_phone || 'N/A'}</a></p>
                    </div>
                    <div class="detail-item">
                        <label>Email</label>
                        <p>${work.reporter_email || 'Not provided'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Sighted Area</label>
                        <p>${work.area_name || 'N/A'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Landmark</label>
                        <p>${work.landmark || 'Not provided'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Number of Dogs</label>
                        <p>${work.dog_count || '1'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Dog Behavior</label>
                        <p style="color:#ef4444;">${work.behavior || 'Calm'}</p>
                    </div>
                    <div class="detail-item">
                        <label>Location Coordinates</label>
                        <p>${work.location_lat || 'N/A'}, ${work.location_lng || 'N/A'}</p>
                        ${work.location_lat && work.location_lng ? `
                        <a href="https://www.google.com/maps/search/?api=1&query=${work.location_lat},${work.location_lng}" target="_blank" class="btn btn-outline" style="margin-top: 6px; padding: 4px 8px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; text-decoration: none; border: 1px solid #3b82f6; color: #3b82f6; background: #fff; width: fit-content;">
                            <span class="material-icons-outlined" style="font-size: 1rem;">map</span> Open in Google Maps
                        </a>
                        ` : ''}
                    </div>
                    <div class="detail-item">
                        <label>Sanctioned Amount</label>
                        <p>₹${work.amount || 0}</p>
                    </div>
                    <div class="detail-item">
                        <label>Report Date & Time</label>
                        <p>${reportedAt}</p>
                    </div>
                    <div class="detail-item">
                        <label>Assigned Date & Time</label>
                        <p>${assignedAt}</p>
                    </div>
                    <div class="detail-item">
                        <label>Complaint Status</label>
                        <p>${work.complaint_status || 'Assigned'}</p>
                    </div>
                </div>

                <div class="detail-item" style="margin-bottom: 20px;">
                    <label>Detailed Sighting Description</label>
                    <div class="desc-box">${work.description || 'No detailed description provided.'}</div>
                </div>

                ${reportImageHtml}

                ${actionHtml}
            `;
        }

        async function uploadReceipt(quotationId) {
            const fileInput = document.getElementById(`receiptFile-${quotationId}`);
            if (!fileInput || !fileInput.files.length) {
                return alert('Please select a receipt image to upload.');
            }

            const formData = new FormData();
            formData.append('quotation_id', quotationId);
            formData.append('receipt', fileInput.files[0]);

            const res = await fetch('/api/ngo/receipts', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });

            if (res.ok) {
                alert('Receipt submitted successfully. Good job!');
                location.reload();
            } else {
                const data = await res.json();
                alert('Error: ' + (data.error || 'Failed to upload receipt.'));
            }
        }

        loadNGOData();
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Image lightbox handlers
        function openImagePreview(imageUrl) {
            document.getElementById('modalPreviewImage').src = imageUrl;
            const modal = document.getElementById('imagePreviewModal');
            modal.style.display = 'flex';
        }

        function closeImagePreview() {
            const modal = document.getElementById('imagePreviewModal');
            modal.style.display = 'none';
            document.getElementById('modalPreviewImage').src = '';
        }
    </script>

    <!-- Photo Lightbox Modal -->
    <div class="receipt-preview-modal" id="imagePreviewModal" onclick="closeImagePreview()" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.75); z-index:1000; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;">
        <img id="modalPreviewImage" src="" alt="Full preview" style="max-width:90vw; max-height:90vh; border-radius:8px; background:#fff; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    </div>
    <script src="auth-nav.js"></script>
</body>
</html>
